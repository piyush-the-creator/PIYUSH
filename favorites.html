<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your curated list of movies and anime on CineVerse.">
    <title>CineVerse | Personalized Watchlist</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">Cine<span>Verse</span></a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="movies.html">Movies</a></li>
                <li><a href="anime.html">Anime</a></li>
                <li><a href="news.html">News</a></li>
                <li><a href="favorites.html" class="active">Watchlist</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
            <div class="nav-actions">
                <button id="themeToggle" class="theme-btn"><i class="fas fa-moon"></i></button>
                <div class="hamburger" id="hamburgerMenu">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container separator-top">
        <header class="section-header">
            <h1>Your Saved Collection</h1>
            <p>Your curated items, safely retained via local state management storage.</p>
        </header>

        <section class="section-block">
            <h2><i class="fas fa-film text-gradient"></i> Selected Movies</h2>
            <div class="grid-container" id="favoriteMoviesGrid"></div>
        </section>

        <section class="section-block">
            <h2><i class="fas fa-tv text-gradient"></i> Saved Anime Titles</h2>
            <div class="grid-container" id="favoriteAnimeGrid"></div>
        </section>
    </main>

    <div id="globalModal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-wrapper">
            <button class="modal-close" id="modalCloseBtn">&times;</button>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/favorites.js"></script>
</body>
</html>
